# lumen.chemcraze.asia — LUMEN ATLAS
# Browser -> Cloudflare -> this nginx (80/443) -> 127.0.0.1:8099
# Certificate: certbot webroot, auto renewal. ACME path must stay on both 80/443.

server {
    listen 80;
    listen [::]:80;
    server_name lumen.chemcraze.asia;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lumen.chemcraze.asia;

    ssl_certificate     /etc/letsencrypt/live/lumen.chemcraze.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumen.chemcraze.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ABSSL:2m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    access_log /www/wwwlogs/lumen.chemcraze.asia.access.log;
    error_log  /www/wwwlogs/lumen.chemcraze.asia.error.log;

    client_max_body_size 60m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_redirect off;
    }
}
